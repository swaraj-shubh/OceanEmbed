# base is not cosmetic: it is what makes Streamlit paint its OWN chrome -- the dataframe
# grid, select popovers and tooltips are canvas-rendered and the page CSS in
# streamlit_app.py cannot reach them at all, so they follow this config, not the glass
# theme's :root vars. The app's own CSS is unconditionally dark (--app-bg is a near-black
# gradient); base was left at "light" from an earlier design and never updated when the
# glass theme went dark, which is why the dataframe grid alone rendered light-on-dark.
# Colours below are picked to match the CSS's own --glass-bg/--body-color, not chosen
# fresh, so native chrome and the CSS-styled panels read as one surface.
[theme]
base = "dark"
primaryColor = "#6b7a8a"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#ffffff"

[server]
# The demo runs offline at a venue; never phone home.
headless = true
