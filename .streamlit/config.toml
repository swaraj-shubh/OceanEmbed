# base is not cosmetic: it is what makes Streamlit paint its OWN chrome -- the dataframe
# grid, select popovers and tooltips are canvas-rendered and the page CSS in
# streamlit_app.py cannot reach them at all, so they follow this config, not the glass
# theme's :root vars. The app's own CSS is dark by default (--app-bg is a near-black
# gradient), so base is dark too. Colours below are picked to match the CSS's own
# --glass-bg/--body-color, so native chrome and the CSS-styled panels read as one surface.
# This is the startup theme only: the Light/Dark button in the app swaps these values at
# runtime (streamlit_app.py THEMES) and charts follow via ui().
[theme]
base = "dark"
primaryColor = "#6b7a8a"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#ffffff"

[server]
# The demo runs offline at a venue; never phone home.
headless = true
