run: m4_attn
model:
  kind: temporal
  in_ch: 7
  out_ch: 15
  base: 32
  depth: 3
  attn: true           # the missing ablation cell: attention AND ConvLSTM together.
  heads: 4             # applied per frame, before the recurrence (see embed()).
window: 7
batch_size: 16
num_workers: 4
lr: 0.001
epochs: 20
seed: 0
